openapi: 3.0.3
info:
  title: Closet App MVP API
  description: DRAFT, not frozen. Machine readable form of docs/api-contract.md, which is the human readable source of truth. If they disagree, docs/api-contract.md wins and this file must be corrected through Agent D.
  version: 0.0.0-draft
servers:
  - url: http://localhost:3101
    description: Local dev server
tags:
  - name: auth
  - name: profile
  - name: palettes
  - name: items
  - name: uploads
  - name: outfits
  - name: wear-logs
  - name: advice-rules
  - name: export
security:
  - bearerAuth: []
paths:
  /api/auth/session:
    get:
      tags: [auth]
      summary: Current session user
      responses:
        '200':
          description: Session user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/profile:
    get:
      tags: [profile]
      summary: Get current user profile
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    patch:
      tags: [profile]
      summary: Update current user profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/palettes:
    get:
      tags: [palettes]
      summary: List palettes
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Palette list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaletteList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [palettes]
      summary: Create a palette
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaletteCreate'
      responses:
        '201':
          description: Palette
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Palette'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/palettes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [palettes]
      summary: Get one palette with colours and avoid rules
      responses:
        '200':
          description: Palette
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Palette'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [palettes]
      summary: Update a palette
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaletteUpdate'
      responses:
        '200':
          description: Palette
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Palette'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [palettes]
      summary: Delete a palette. Items are never deleted by this.
      responses:
        '200':
          description: Deleted marker
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deleted'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/palettes/{id}/activate:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [palettes]
      summary: Make this palette the active palette
      responses:
        '200':
          description: Palette
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Palette'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/palettes/{id}/versions:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [palettes]
      summary: Create a new version copy of a palette
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                activate:
                  type: boolean
                name:
                  type: string
      responses:
        '201':
          description: New palette version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Palette'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/palettes/{id}/rerate:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [palettes]
      summary: Re-rate all user items against this palette
      responses:
        '200':
          description: Re-rate counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RerateResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/palettes/{paletteId}/colours:
    parameters:
      - name: paletteId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [palettes]
      summary: List palette colours
      parameters:
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/PaletteRole'
      responses:
        '200':
          description: Palette colour list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaletteColourList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [palettes]
      summary: Add a palette colour
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaletteColourCreate'
      responses:
        '201':
          description: Palette colour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaletteColour'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/palettes/{paletteId}/colours/{colourId}:
    parameters:
      - name: paletteId
        in: path
        required: true
        schema:
          type: string
      - name: colourId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [palettes]
      summary: Get one palette colour
      responses:
        '200':
          description: Palette colour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaletteColour'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [palettes]
      summary: Update a palette colour
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaletteColourUpdate'
      responses:
        '200':
          description: Palette colour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaletteColour'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [palettes]
      summary: Delete a palette colour
      responses:
        '200':
          description: Deleted marker
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deleted'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/palettes/{paletteId}/avoid-rules:
    parameters:
      - name: paletteId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [palettes]
      summary: List avoid rules
      responses:
        '200':
          description: Avoid rule list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvoidRuleList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [palettes]
      summary: Create an avoid rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvoidRuleCreate'
      responses:
        '201':
          description: Avoid rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvoidRule'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/palettes/{paletteId}/avoid-rules/{ruleId}:
    parameters:
      - name: paletteId
        in: path
        required: true
        schema:
          type: string
      - name: ruleId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [palettes]
      summary: Get one avoid rule
      responses:
        '200':
          description: Avoid rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvoidRule'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [palettes]
      summary: Update an avoid rule
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvoidRuleUpdate'
      responses:
        '200':
          description: Avoid rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvoidRule'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [palettes]
      summary: Delete an avoid rule
      responses:
        '200':
          description: Deleted marker
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deleted'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/items:
    get:
      tags: [items]
      summary: List items with filters
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: category
          in: query
          schema:
            type: string
        - name: paletteVerdict
          in: query
          schema:
            $ref: '#/components/schemas/Verdict'
        - name: season
          in: query
          schema:
            $ref: '#/components/schemas/Season'
        - name: fitTag
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ItemStatus'
        - name: colourFamily
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [paletteScore, wearCount, recent, name]
      responses:
        '200':
          description: Item list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemList'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [items]
      summary: Create an item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemCreate'
      responses:
        '201':
          description: Item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/items/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [items]
      summary: Get one item with colours and signed photo URLs
      responses:
        '200':
          description: Item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [items]
      summary: Update an item
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemUpdate'
      responses:
        '200':
          description: Item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [items]
      summary: Soft delete an item
      responses:
        '200':
          description: Deleted marker
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deleted'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/items/{id}/restore:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [items]
      summary: Restore a soft deleted item within 30 days
      responses:
        '200':
          description: Item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/items/{id}/permanent-delete:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [items]
      summary: Permanently delete an already soft deleted item
      responses:
        '200':
          description: Deleted marker
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deleted'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/items/{itemId}/colours:
    parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [items]
      summary: List item colours
      responses:
        '200':
          description: Item colour list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemColourList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [items]
      summary: Replace the full item colour set
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [colours]
              properties:
                colours:
                  type: array
                  maxItems: 3
                  items:
                    $ref: '#/components/schemas/ItemColourCreate'
      responses:
        '200':
          description: Item colour list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemColourList'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/uploads:
    post:
      tags: [uploads]
      summary: Upload a compressed WebP image through the StorageProvider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadCreate'
      responses:
        '201':
          description: Upload result with storage path, never a public URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/uploads/signed-url:
    post:
      tags: [uploads]
      summary: Get a short lived signed URL for a storage path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                expiresInSeconds:
                  type: integer
                  minimum: 60
                  maximum: 86400
                  default: 3600
      responses:
        '200':
          description: Signed URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedUrl'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/outfits:
    get:
      tags: [outfits]
      summary: List outfits
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: occasion
          in: query
          schema:
            $ref: '#/components/schemas/Occasion'
        - name: saved
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Outfit list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutfitList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [outfits]
      summary: Create an outfit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutfitCreate'
      responses:
        '201':
          description: Outfit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Outfit'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/outfits/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [outfits]
      summary: Get one outfit with items
      responses:
        '200':
          description: Outfit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Outfit'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [outfits]
      summary: Update an outfit
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutfitUpdate'
      responses:
        '200':
          description: Outfit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Outfit'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [outfits]
      summary: Delete an outfit and its outfit items
      responses:
        '200':
          description: Deleted marker
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deleted'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/outfits/{outfitId}/items:
    parameters:
      - name: outfitId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [outfits]
      summary: List outfit items
      responses:
        '200':
          description: Outfit item list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutfitItemList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [outfits]
      summary: Add one item to an outfit in a slot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutfitItemCreate'
      responses:
        '201':
          description: Outfit item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutfitItem'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/outfits/{outfitId}/items/{itemId}:
    parameters:
      - name: outfitId
        in: path
        required: true
        schema:
          type: string
      - name: itemId
        in: path
        required: true
        schema:
          type: string
    delete:
      tags: [outfits]
      summary: Remove an item from an outfit
      responses:
        '200':
          description: Deleted marker
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deleted'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/wear-logs:
    get:
      tags: [wear-logs]
      summary: List wear logs
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: outfitId
          in: query
          schema:
            type: string
