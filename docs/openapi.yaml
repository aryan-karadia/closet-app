components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    ValidationError:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: Unauthenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Wrong owner
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Missing resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [VALIDATION_ERROR, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, METHOD_NOT_ALLOWED, INTERNAL_ERROR]
            message:
              type: string
            details:
              type: object
              additionalProperties:
                type: string
    Deleted:
      type: object
      properties:
        deleted:
          type: boolean
        id:
          type: string
        softDeleted:
          type: boolean
    Pagination:
      type: object
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    Session:
      type: object
      properties:
        user:
          type: object
          properties:
            id:
              type: string
            email:
              type: string
              nullable: true
    Profile:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        displayName:
          type: string
          nullable: true
        fitTags:
          type: array
          items:
            type: string
        styleDirection:
          type: string
          nullable: true
        activePaletteId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProfileUpdate:
      type: object
      properties:
        displayName:
          type: string
          nullable: true
          maxLength: 100
        fitTags:
          type: array
          maxItems: 20
          items:
            type: string
        styleDirection:
          type: string
          nullable: true
          maxLength: 200
        activePaletteId:
          type: string
          nullable: true
    ColourFamily:
      type: string
      enum: [blue, green, purple, red, teal, plum, burgundy, black, gray, navy, orange, brown, pink, yellow, white, other]
    PaletteRole:
      type: string
      enum: [core, neutral, avoid]
    Season:
      type: string
      enum: [winter, spring, autumn, summer, all-season]
    Verdict:
      type: string
      enum: [Perfect, Strong, Works, Avoid]
    ItemStatus:
      type: string
      enum: [in rotation, stored, archived]
    Occasion:
      type: string
      enum: [daily, interview, formal, japan-travel, date-evening]
    OutfitSlot:
      type: string
      enum: [base-top, outer-layer, bottom, shoes, accessory]
    Vibe:
      type: string
      enum: [structured-softboy, clean-minimal, light-old-money, streetwear-minimal]
